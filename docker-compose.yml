name: agentx

networks:
  agentx-net:
    driver: bridge

volumes:
  redis_data:
  ollama_data:
  chroma_data:
  opa_data:
  postgres_data:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: agentx
      POSTGRES_PASSWORD: agentx_dev_pw_2026
      POSTGRES_DB: agentx_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports: ["5432:5432"]
    networks: [agentx-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentx -d agentx_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes: [redis_data:/data]
    ports: ["6379:6379"]
    networks: [agentx-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes: [ollama_data:/root/.ollama]
    ports: ["11434:11434"]
    networks: [agentx-net]
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Pulls models only if they are not already present in the ollama_data
  # volume. `ollama list` queries the running ollama server — if the model
  # name appears in the output, the pull is skipped entirely so restarting
  # the stack never re-downloads gigabytes of weights.
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    networks: [agentx-net]
    volumes: [ollama_data:/root/.ollama]
    entrypoint: ["sh", "-c", "
      pull_if_missing() {
        if OLLAMA_HOST=ollama:11434 ollama list | grep -q \"$1\"; then
          echo \"$1 already present, skipping pull\";
        else
          echo \"Pulling $1 ...\";
          OLLAMA_HOST=ollama:11434 ollama pull \"$1\";
        fi
      };
      pull_if_missing qwen2.5-coder:3b &&
      pull_if_missing llama-guard3:1b &&
      pull_if_missing nomic-embed-text"]
    restart: "no"

  chromadb:
    image: chromadb/chroma:latest
    restart: unless-stopped
    volumes: [chroma_data:/chroma/chroma]
    ports: ["8001:8000"]
    networks: [agentx-net]
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8000"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Identity Broker (C7) evaluates every scoped-credential request against
  # this. Runs the bundled Rego policy directly off disk — no bundle
  # server needed at this scale, just point it at the folder.
  opa:
    image: openpolicyagent/opa:latest-envoy
    restart: unless-stopped
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policies"]
    volumes:
      - ./backend/governance/policies:/policies:ro
      - opa_data:/opa-data
    ports: ["8181:8181"]
    networks: [agentx-net]
    healthcheck:
      test: ["CMD", "/opa", "eval", "--bundle", "/policies", "data"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      OLLAMA_URL: http://ollama:11434
      CHROMA_URL: http://chromadb:8000
      OPA_URL: http://opa:8181
    ports: ["8000:8000"]
    networks: [agentx-net]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      ollama: { condition: service_healthy }
      chromadb: { condition: service_healthy }
      opa: { condition: service_healthy }

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    command: celery -A celery_worker worker --loglevel=info --concurrency=4
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      OLLAMA_URL: http://ollama:11434
      CHROMA_URL: http://chromadb:8000
      OPA_URL: http://opa:8181
    networks: [agentx-net]
    healthcheck:
      test: ["CMD-SHELL", "celery -A celery_worker inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      ollama: { condition: service_healthy }

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_WS_URL: ws://localhost:8000
    ports: ["3000:3000"]
    networks: [agentx-net]

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    ports: ["80:80", "443:443"]
    networks: [agentx-net]
    depends_on:
      backend: { condition: service_healthy }
      frontend: { condition: service_started }