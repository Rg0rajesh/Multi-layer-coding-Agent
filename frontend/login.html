<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent X — Log in</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
<div class="auth-page">
  <aside class="auth-panel">
    <a href="index.html" class="auth-panel__brand" style="text-decoration:none; color:inherit;">AGENT X</a>
    <p class="auth-panel__tagline">Plan, code, test, and review — carried through ten specialised agents, with you approving every plan.</p>
    <div class="auth-panel__log" id="log-box"></div>
  </aside>

  <main class="auth-form-wrap">
    <form class="auth-form" id="auth-form" novalidate>
      <div class="auth-tabs" role="tablist">
        <button type="button" class="auth-tabs__item is-active" id="tab-login" role="tab" aria-selected="true">Log in</button>
        <button type="button" class="auth-tabs__item" id="tab-signup" role="tab" aria-selected="false">Sign up</button>
      </div>

      <div class="auth-field" data-signup-only style="display:none;">
        <label class="auth-field__label" for="full-name">Full name</label>
        <div class="auth-field__control">
          <input type="text" id="full-name" autocomplete="name">
        </div>
        <span class="auth-field__error"></span>
      </div>

      <div class="auth-field">
        <label class="auth-field__label" for="email">Email</label>
        <div class="auth-field__control">
          <input type="email" id="email" autocomplete="email" required>
        </div>
        <span class="auth-field__error"></span>
      </div>

      <div class="auth-field">
        <label class="auth-field__label" for="password">Password</label>
        <div class="auth-field__control">
          <input type="password" id="password" autocomplete="current-password" required>
        </div>
        <span class="auth-field__error"></span>
      </div>

      <div class="strength-meter" data-signup-only style="display:none;" aria-live="polite">
        <div class="strength-meter__bars">
          <span class="strength-meter__bar"></span>
          <span class="strength-meter__bar"></span>
          <span class="strength-meter__bar"></span>
          <span class="strength-meter__bar"></span>
        </div>
        <span class="strength-meter__label" id="strength-label">Weak</span>
      </div>

      <div class="auth-field" data-signup-only style="display:none;">
        <label class="auth-field__label" for="confirm-password">Confirm password</label>
        <div class="auth-field__control">
          <input type="password" id="confirm-password" autocomplete="new-password">
        </div>
        <span class="auth-field__error"></span>
      </div>

      <label class="auth-checkbox" data-signup-only style="display:none;">
        <input type="checkbox" id="agree-terms">
        <span>I agree to the <a href="docs.html">Terms of Service</a></span>
      </label>

      <div id="form-error" class="auth-form__error" style="display:none;"></div>

      <button type="submit" class="auth-submit" id="submit-btn">Log In</button>

      <div class="auth-divider">or</div>
      <div class="auth-oauth">
        <button type="button" class="auth-oauth__btn" id="github-oauth-btn">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
          Continue with GitHub
        </button>
        <button type="button" class="auth-oauth__btn" id="google-oauth-btn">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="6.5"/><path d="M8 8h4.6a4.6 4.6 0 1 1-1.4-3.4" stroke-linecap="round"/></svg>
          Continue with Google
        </button>
      </div>
    </form>
  </main>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
  // typewriter log — decorative, mirrors the AGENTX log-line format
  const LOG_LINES = [
    "SYSTEM · INIT   Pipeline initialised. 10 agents standing by.",
    "PLANNER  TASK  Received: Build JWT auth API in TypeScript",
    "PLANNER  EXEC  Decomposing into 6 subtasks...",
    "CODER  TASK   Received subtask 1: Setup Express server",
    "CODER  DONE   server.ts complete. 127 lines written.",
    "TESTER  DONE  12/12 tests passed. Passing to Reviewer.",
    "REVIEWER  DONE  Review complete. Score: 8.7/10.",
  ];
  const logBox = document.getElementById("log-box");
  let li = 0, ci = 0;
  function typeLine() {
    const line = LOG_LINES[li % LOG_LINES.length];
    if (ci <= line.length) {
      logBox.innerHTML = LOG_LINES.slice(0, li).map(l => `<div class="auth-panel__log-line">${l}</div>`).join("")
        + `<div class="auth-panel__log-line">${line.slice(0, ci)}<span class="auth-panel__cursor"></span></div>`;
      ci++;
      setTimeout(typeLine, 26);
    } else {
      li++;
      ci = 0;
      if (li >= LOG_LINES.length) { li = 0; logBox.innerHTML = ""; }
      setTimeout(typeLine, 1100);
    }
  }
  if (logBox) typeLine();
</script>
</body>
</html>
