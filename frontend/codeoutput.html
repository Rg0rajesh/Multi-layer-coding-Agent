<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent X — Code Output</title>
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/sidebar.css" />
  <link rel="stylesheet" href="css/codeoutput.css" />
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-root"></div>
    <main class="app-main">
      <div class="page-header">
        <div>
          <h1>Code Output</h1>
          <p class="page-header__meta" id="task-title">Loading task…</p>
        </div>
        <a href="#" id="download-zip-link" class="btn btn--fill">Download ZIP</a>
      </div>

      <p class="codeoutput__status-text" id="status-text" style="display:none"></p>

      <div class="codeoutput__layout">
        <aside class="codeoutput__tree" id="file-tree"></aside>
        <section class="codeoutput__viewer">
          <div class="codeoutput__viewer-header" id="viewer-header">Select a file</div>
          <pre class="codeoutput__code" id="viewer-code"></pre>
        </section>
      </div>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/codeoutput.js"></script>
</body>
</html>
