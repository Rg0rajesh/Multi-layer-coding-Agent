<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent X — Profile</title>
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/sidebar.css" />
  <link rel="stylesheet" href="css/profile.css" />
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-root"></div>
    <main class="app-main">
      <div class="page-header">
        <div>
          <h1>Profile</h1>
          <p class="page-header__meta">Manage your public information</p>
        </div>
      </div>

      <div class="card">
        <div class="profile__header">
          <div class="profile__avatar">U</div>
          <div>
            <h3 style="margin: 0; font-size: 1.1rem;">Your Avatar</h3>
            <p class="text-secondary" style="font-size: 0.85rem; margin-top: 4px;">Update your avatar via Gravatar</p>
          </div>
        </div>

        <form class="profile__form" id="profile-form">
          <label>
            Display Name
            <input type="text" id="display-name" placeholder="E.g. Jordan Smith" />
          </label>
          
          <label>
            Bio
            <textarea id="bio" rows="4" placeholder="Tell us about yourself"></textarea>
          </label>
          
          <label>
            Website URL
            <input type="url" id="website-url" placeholder="https://example.com" />
          </label>
          
          <label>
            GitHub URL
            <input type="url" id="github-url" placeholder="https://github.com/username" />
          </label>
          
          <label>
            Twitter Handle
            <input type="text" id="twitter-handle" placeholder="@username" />
          </label>
          
          <p id="form-error" style="display:none; color: var(--error); font-weight: 600;"></p>
          
          <button type="submit" class="btn btn--fill" style="margin-top: 10px;">Save Changes</button>
        </form>
      </div>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
