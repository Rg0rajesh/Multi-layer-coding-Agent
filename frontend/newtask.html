<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent X — New Task</title>
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/sidebar.css" />
  <link rel="stylesheet" href="css/newtask.css" />
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-root"></div>
    <main class="app-main">
      <div class="page-header">
        <div>
          <h1>New Task</h1>
          <p class="page-header__meta">Guardrail screens it, Planner breaks it down, you approve the plan.</p>
        </div>
      </div>

      <form class="new-task-form card" id="new-task-form">
        <label class="new-task-field">
          <span>Title</span>
          <input id="title" placeholder="Build a JWT refresh endpoint" autofocus />
        </label>

        <label class="new-task-field">
          <span>Description</span>
          <textarea id="description" rows="5" placeholder="What should the Coder actually build? The more specific, the fewer re-plans."></textarea>
        </label>

        <div class="new-task-row">
          <label class="new-task-field">
            <span>Language</span>
            <select id="language">
              <option value="python">python</option>
              <option value="typescript">typescript</option>
              <option value="javascript">javascript</option>
              <option value="go">go</option>
              <option value="rust">rust</option>
              <option value="java">java</option>
            </select>
          </label>

          <label class="new-task-field">
            <span>Priority</span>
            <select id="priority">
              <option value="low">low</option>
              <option value="medium" selected>medium</option>
              <option value="high">high</option>
            </select>
          </label>

          <label class="new-task-field">
            <span>Time budget (min)</span>
            <input type="number" id="max-minutes" min="1" max="120" value="10" />
          </label>
        </div>

        <label class="new-task-checkbox">
          <input type="checkbox" id="git-integration" />
          <span>Enable Git integration for this task</span>
        </label>

        <p class="new-task-form__error" id="form-error" style="display:none"></p>

        <button type="submit" class="btn btn--fill" id="submit-btn">Start Task</button>
      </form>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/newtask.js"></script>
</body>
</html>
