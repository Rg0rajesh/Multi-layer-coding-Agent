<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent X — Live Monitor</title>
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/sidebar.css" />
  <link rel="stylesheet" href="css/status-pill.css" />
  <link rel="stylesheet" href="css/agentpanel.css" />
  <link rel="stylesheet" href="css/logstream.css" />
  <link rel="stylesheet" href="css/livemonitor.css" />
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-root"></div>
    <main class="app-main">
      <div class="page-header">
        <div>
          <h1>Live Monitor</h1>
          <p class="page-header__meta" id="task-title">Loading task…</p>
        </div>
        <span class="ws-indicator" id="ws-indicator">○ connecting</span>
      </div>

      <p class="livemonitor__status-text" id="status-text" style="display:none"></p>

      <div class="agent-panel-grid" id="agent-panel-grid"></div>

      <h2 class="livemonitor__log-heading">Live Log</h2>
      <div class="log-stream" id="log-stream"></div>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/livemonitor.js"></script>
</body>
</html>
