<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent X — Team</title>
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/sidebar.css" />
  <link rel="stylesheet" href="css/team.css" />
  <link rel="stylesheet" href="css/status-pill.css" />
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-root"></div>
    <main class="app-main">
      <div class="page-header">
        <div>
          <h1>Team</h1>
          <p class="page-header__meta">Manage your teams and members</p>
        </div>
        <button id="new-team-btn" class="btn btn--fill">New Team</button>
      </div>

      <p id="status-text" style="color: var(--error); display:none;"></p>

      <div class="card" style="margin-bottom: 20px;">
        <h3 style="margin-top: 0;">Your Teams</h3>
        <div id="team-list" class="team__list">
          Loading teams...
        </div>
      </div>

      <div class="card" id="members-section" style="display:none;">
        <h3 style="margin-top: 0;" id="members-heading">Members</h3>
        <div id="members-list" class="team__members-list">
          Loading members...
        </div>
      </div>

    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/team.js"></script>
</body>
</html>
